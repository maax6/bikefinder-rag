<text x="56" y="604" font-size="20" font-weight="700">Read an interval as a family, not as one review per year.</text>
<text x="56" y="633" class="body">A CB 250 comment is attached to the family spanning 1967–2020 in these files.</text>
<text x="56" y="660" class="body">The comment's publication date is separate. Gaps show years absent from this selection.</text>
<text x="38" y="707" font-size="14" class="muted">Illustrative selection · bundled Bikez files: century, 2000s, demo · checked 10 Oct 2026 · French reviews are outside this view.</text>
