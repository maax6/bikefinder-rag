<title id="title">Review coverage by model family</title>
<desc id="description">Examples from the selected Bikez datasets: century, 2000s and demo. Their catalog years span 1894 to 2024. Each dot is a model year in this selection; other bundled datasets or the database can contain additional years. Comments belong to the shared model family; no review coverage is guaranteed for an individual year. BMW R 16 has no comments in these files.</desc>
